<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 音乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    
    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>

    <style>
        /* 核心布局修复：强制锁定 Webamp 窗口 */
        #webamp-container {
            position: relative;
            width: 275px; /* Winamp 标准宽度 */
            height: 350px;
            margin: 0 auto;
        }
        
        /* 强制让 Webamp 渲染出来的 DOM 节点锚定在父容器 */
        #webamp {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 50 !important;
        }

        /* 紧凑型玻璃面板 */
        .compact-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* 侧边栏呼吸灯效果 */
        .sidebar-active-glow {
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.1);
        }
    </style>
</head>
<body class="bg-[#f8fbff]">

    <div class="flex flex-col min-h-screen relative">
        <div id="header-container"></div>
        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[980px] mx-auto px-4 pb-12 mt-8">
            
            <div class="flex flex-col lg:flex-row gap-6">
                
                <div class="w-full lg:w-[300px] shrink-0">
                    <div class="compact-glass rounded-2xl p-4 sidebar-active-glow flex flex-col items-center border-t-white border-l-white">
                        <div class="w-full border-b border-blue-100 pb-2 mb-6 flex items-center justify-between px-1">
                            <span class="text-[9px] font-black text-blue-500/60 tracking-widest uppercase">Audio Terminal v1.0</span>
                            <div class="flex gap-1">
                                <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                                <div class="w-1.5 h-1.5 rounded-full bg-blue-200"></div>
                            </div>
                        </div>

                        <div id="webamp-container">
                            <div id="loading-hint" class="absolute inset-0 flex flex-col items-center justify-center text-blue-400/50 text-[10px] font-bold italic">
                                INITIALIZING...
                            </div>
                        </div>

                        <div class="mt-8 w-full bg-blue-50/50 rounded-lg p-3 border border-blue-100/50">
                            <div class="flex items-center gap-2 mb-1">
                                <i data-lucide="activity" class="w-3 h-3 text-blue-500"></i>
                                <span class="text-[10px] font-black text-blue-800 uppercase">Device Status</span>
                            </div>
                            <div class="text-[9px] text-blue-600/70 font-bold leading-relaxed">
                                Mode: High-Fidelity Output<br>
                                Buffer: Synchronized
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col gap-5 min-w-0">
                    
                    <section class="compact-glass rounded-xl overflow-hidden flex flex-col">
                        <div class="bg-gradient-to-r from-[#0088ff] to-[#00ccff] h-[32px] px-4 flex items-center justify-between border-b border-blue-600/20">
                            <div class="flex items-center gap-2 text-white text-[11px] font-black drop-shadow-sm">
                                <i data-lucide="layout" class="w-3.5 h-3.5"></i>
                                <span class="tracking-widest uppercase">皮肤档案库 (Skin Library)</span>
                            </div>
                            <div id="active-skin-name" class="text-[9px] text-white/80 font-bold bg-white/10 px-2 py-0.5 rounded italic">Default</div>
                        </div>
                        
                        <div class="p-4">
                            <div id="skin-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2">
                                </div>
                        </div>
                    </section>

                    <section class="compact-glass rounded-xl overflow-hidden flex flex-col">
                        <div class="bg-gradient-to-r from-[#0088ff] to-[#00ccff] h-[32px] px-4 flex items-center justify-between border-b border-blue-600/20">
                            <div class="flex items-center gap-2 text-white text-[11px] font-black drop-shadow-sm">
                                <i data-lucide="database" class="w-3.5 h-3.5"></i>
                                <span class="tracking-widest uppercase">系统音轨集 (Audio Database)</span>
                            </div>
                        </div>
                        <div id="music-playlist-container" class="p-2">
                            </div>
                    </section>

                </div>
            </div>
        </main>
        
        <div id="footer-container"></div>
    </div>

    <script>window.ACTIVE_PAGE = 'musics';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        let webampInstance = null;

        const SKINS = [
            { id: 'aqua', name: 'Aqua X', file: 'Aqua_X.wsz' },
            { id: 'argentum', name: 'Argentum Blue', file: 'Argentum_Blue.wsz' },
            { id: 'dolphin', name: 'Dolphin Trio', file: 'Dolphin_Trio.wsz' },
            { id: 'glass', name: 'Glass Amp 4', file: 'Glass_Amp_4.wsz' },
            { id: 'water', name: 'Waterdrops', file: 'Waterdrops.wsz' },
            { id: 'wmp', name: 'Windows Media', file: 'WindowsMediaPlayer1-0.wsz' },
            { id: 'yuna', name: 'Yunaofffx', file: 'Yunaofffx.wsz' }
        ];

        let currentSkinId = SKINS[0].id;

        window.addEventListener('DOMContentLoaded', () => {
            renderSkinGrid();
            setTimeout(() => {
                initWebampPlayer();
                if (typeof renderMusicPlaylist === 'function') {
                    renderMusicPlaylist('music-playlist-container');
                }
            }, 300);
        });

        function initWebampPlayer() {
            const container = document.getElementById('webamp-container');
            if (typeof Webamp === 'undefined') return;

            const musicUrl = new URL("music/elis_ladder-thunder_disc.mp3", window.location.href).href;

            webampInstance = new Webamp({
                initialTracks: [{
                    metaData: { artist: "Eli's Ladder", title: "Thunder Disc" },
                    url: musicUrl
                }],
                initialSkin: {
                    url: new URL(`skin/${SKINS[0].file}`, window.location.href).href
                },
                // 窗口布局垂直堆叠，保证在 275px 宽度内显示完整
                __initialWindowLayout: {
                    main: { position: { x: 0, y: 0 } },
                    equalizer: { position: { x: 0, y: 116 } },
                    playlist: { position: { x: 0, y: 232 } } 
                }
            });

            webampInstance.renderWhenReady(container).then(() => {
                const hint = document.getElementById('loading-hint');
                if(hint) hint.style.display = 'none';
                document.getElementById('active-skin-name').innerText = SKINS[0].name;
            });
        }

        function renderSkinGrid() {
            const grid = document.getElementById('skin-grid');
            grid.innerHTML = SKINS.map(skin => {
                const active = skin.id === currentSkinId;
                return `
                    <button onclick="changeSkin('${skin.id}', '${skin.file}', '${skin.name}')" 
                        class="flex items-center gap-2 px-3 py-2 rounded-md border text-left transition-all duration-200 group
                        ${active ? 'bg-blue-50 border-blue-400 shadow-inner' : 'bg-white/50 border-gray-100 hover:border-blue-300 hover:bg-white'}">
                        <div class="w-5 h-5 rounded flex items-center justify-center shrink-0 ${active ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-400 group-hover:text-blue-400'}">
                            <i data-lucide="box" class="w-3 h-3"></i>
                        </div>
                        <span class="text-[10px] font-black tracking-tight truncate ${active ? 'text-blue-800' : 'text-gray-500'}">${skin.name}</span>
                    </button>
                `;
            }).join('');
            if(window.lucide) lucide.createIcons();
        }

        function changeSkin(id, file, name) {
            if (!webampInstance || id === currentSkinId) return;
            currentSkinId = id;
            renderSkinGrid();
            
            const skinUrl = new URL(`skin/${file}`, window.location.href).href;
            webampInstance.setSkinFromUrl(skinUrl);
            document.getElementById('active-skin-name').innerText = name;
        }
    </script>
</body>
</html>
