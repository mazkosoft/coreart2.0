<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>核类艺术协会™ | 音乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    
    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>

    <style>
        /* 布局基础：彻底解决溢出和移动端不对称白边 */
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #f5f9ff;
        }

        /* 统一面板样式：完全遵循核类艺术 Aero 设计语言 */
        .glass-panel-unified {
            background: rgba(240, 248, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 25px rgba(0, 40, 80, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            border-radius: 0.6rem;
            overflow: hidden;
            width: 100%;
        }

        .panel-header-gradient {
            background: linear-gradient(to bottom, #009dff, #0077ff, #00ccff);
            border-bottom: 1.5px solid #0055cc;
            height: 36px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            flex-shrink: 0;
        }

        .header-shine {
            position: absolute;
            top: 2px;
            left: 3px;
            right: 3px;
            height: 48%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0.1));
            pointer-events: none;
            z-index: 10;
            border-radius: 0.4rem;
        }

        .header-text {
            position: relative;
            z-index: 20;
            color: white;
            font-weight: 900;
            font-size: 13px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* Webamp 锚定逻辑：死死锁在面板内部 */
        #webamp-container {
            position: relative;
            width: 275px; 
            height: 350px;
            margin: 0 auto;
        }
        
        #webamp {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 50 !important;
        }
        
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 119, 255, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 119, 255, 0.4); }
    </style>
</head>
<body>

    <div class="flex flex-col min-h-screen relative w-full">
        <div id="header-container"></div>
        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-12 mt-8 box-border">
            
            <div class="flex flex-col lg:flex-row gap-6 items-start w-full">
                
                <div class="w-full lg:w-[310px] shrink-0 flex flex-col gap-6">
                    
                    <section class="glass-panel-unified">
                        <div class="panel-header-gradient">
                            <div class="header-shine"></div>
                            <div class="header-text">
                                <i data-lucide="music" class="w-4 h-4"></i>
                                <span>音频终端 (Audio Terminal)</span>
                            </div>
                        </div>
                        <div class="p-4 bg-gradient-to-b from-blue-50/50 to-transparent flex flex-col items-center">
                            <div id="webamp-container">
                                <div id="loading-hint" class="absolute inset-0 flex items-center justify-center text-blue-400 text-[10px] animate-pulse font-bold tracking-widest">
                                    BOOTING SYSTEM...
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="glass-panel-unified">
                        <div class="panel-header-gradient">
                            <div class="header-shine"></div>
                            <div class="header-text">
                                <i data-lucide="info" class="w-4 h-4"></i>
                                <span>音轨档案 (Track Details)</span>
                            </div>
                        </div>
                        <div class="p-5 flex flex-col">
                            <div class="flex items-start gap-4 mb-4">
                                <div class="w-16 h-16 rounded-lg bg-gradient-to-br from-blue-400 to-blue-600 shadow-md shrink-0 flex items-center justify-center text-white border-2 border-white/50">
                                    <i data-lucide="disc-3" class="w-8 h-8 opacity-90"></i>
                                </div>
                                <div class="flex flex-col justify-center overflow-hidden pt-1">
                                    <h3 class="text-[13px] font-black text-blue-900 truncate tracking-tight">Thunder Disc</h3>
                                    <p class="text-[11px] font-bold text-slate-500 truncate mt-0.5">Eli's Ladder</p>
                                    <div class="mt-2 flex gap-1.5">
                                        <span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-600 text-[8px] font-black uppercase tracking-wider border border-blue-200">MP3</span>
                                        <span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-600 text-[8px] font-black uppercase tracking-wider border border-blue-200">Local</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="text-[11px] text-slate-600 leading-relaxed font-medium mb-5 bg-white/60 p-3 rounded-lg border border-white shadow-sm">
                                此音轨为核类艺术协会收录的本地精选源文件。采用经典合成器音色重构，带有强烈的复古电子与合成器波（Synthwave）风格，支持高保真本地回放与离线下载。
                            </div>

                            <a href="music/elis_ladder-thunder_disc.mp3" download="Thunder Disc - Eli's Ladder.mp3" 
                               class="w-full py-2.5 rounded-lg bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 active:scale-[0.98] text-white text-[11px] font-black tracking-[0.15em] flex items-center justify-center gap-2 transition-all shadow-md shadow-blue-500/30 cursor-pointer">
                                <i data-lucide="download-cloud" class="w-4 h-4"></i>
                                下载源文件 (DOWNLOAD)
                            </a>
                        </div>
                    </section>
                </div>

                <div class="flex-1 flex flex-col gap-6 w-full min-w-0">
                    
                    <section class="glass-panel-unified">
                        <div class="panel-header-gradient">
                            <div class="header-shine"></div>
                            <div class="header-text">
                                <i data-lucide="palette" class="w-4 h-4"></i>
                                <span>皮肤终端 (Skin Terminal)</span>
                            </div>
                        </div>
                        <div class="p-6">
                            <div id="skin-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">
                                </div>
                        </div>
                    </section>

                    <section class="glass-panel-unified flex flex-col">
                        <div class="panel-header-gradient">
                            <div class="header-shine"></div>
                            <div class="header-text">
                                <img src="img/Folder203.ico" class="w-[25px] h-[25px] object-contain" onerror="this.style.display='none'">
                                <span>音轨数据库 (Track Database)</span>
                            </div>
                        </div>
                        <div id="music-playlist-container" class="p-4 custom-scrollbar">
                            </div>
                    </section>

                </div>
            </div>
        </main>
        
        <div id="footer-container"></div>
    </div>

    <script>window.ACTIVE_PAGE = 'musics';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        let webampInstance = null;

        // 包含你所有皮肤的完整名单
        const SKINS = [
            { id: 'aqua', name: 'Aqua X', file: 'Aqua_X.wsz' },
            { id: 'argentum', name: 'Argentum Blue', file: 'Argentum_Blue.wsz' },
            { id: 'dolphin', name: 'Dolphin Trio', file: 'Dolphin_Trio.wsz' },
            { id: 'glass', name: 'Glass Amp 4', file: 'Glass Amp 4.wsz' },
            { id: 'water', name: 'Waterdrops', file: 'Waterdrops.wsz' },
            { id: 'wmp', name: 'Windows Media', file: 'WindowsMediaPlayer1-0.wsz' },
            { id: 'yuna', name: 'Yunaofffx', file: 'Yunaofffx.wsz' }
        ];

        let currentSkinId = SKINS[3].id; // 默认选中 Glass Amp 4

        window.addEventListener('DOMContentLoaded', () => {
            renderSkinGrid();
            setTimeout(() => {
                initWebampPlayer();
                if (typeof renderMusicPlaylist === 'function') {
                    renderMusicPlaylist('music-playlist-container');
                }
            }, 300);
        });

        function initWebampPlayer() {
            const container = document.getElementById('webamp-container');
            if (typeof Webamp === 'undefined') return;

            const musicUrl = new URL("music/elis_ladder-thunder_disc.mp3", window.location.href).href;

            webampInstance = new Webamp({
                initialTracks: [{
                    metaData: { artist: "Eli's Ladder", title: "Thunder Disc" },
                    url: musicUrl
                }],
                initialSkin: {
                    url: new URL(`skin/Glass Amp 4.wsz`, window.location.href).href
                },
                __initialWindowLayout: {
                    main: { position: { x: 0, y: 0 } },
                    equalizer: { position: { x: 0, y: 116 } },
                    playlist: { position: { x: 0, y: 232 } } 
                }
            });

            webampInstance.renderWhenReady(container).then(() => {
                document.getElementById('loading-hint').style.display = 'none';
            });
        }

        // 渲染精致的皮肤磁贴
        function renderSkinGrid() {
            const grid = document.getElementById('skin-grid');
            grid.innerHTML = SKINS.map(skin => {
                const active = skin.id === currentSkinId;
                return `
                    <button onclick="handleSkinSwitch('${skin.id}', '${skin.file}')" 
                        class="flex items-center gap-3 p-3 rounded-lg border transition-all duration-300 group
                        ${active ? 'bg-[#e6f4ff] border-[#3a8ef5] shadow-inner' : 'bg-white/50 border-[#d0e0f0] hover:bg-white hover:border-[#88ccff]'}">
                        <div class="w-8 h-8 rounded bg-gradient-to-br from-[#00ccff] to-[#0077ff] flex items-center justify-center text-white shrink-0 shadow-sm transition-transform group-hover:scale-110">
                            <i data-lucide="layers" class="w-4 h-4"></i>
                        </div>
                        <span class="text-[10px] font-black truncate w-full text-left ${active ? 'text-blue-800' : 'text-slate-600'}">${skin.name}</span>
                    </button>
                `;
            }).join('');
            if(window.lucide) lucide.createIcons();
        }

        function handleSkinSwitch(id, file) {
            if (!webampInstance || id === currentSkinId) return;
            currentSkinId = id;
            renderSkinGrid();
            const skinUrl = new URL(`skin/${file}`, window.location.href).href;
            webampInstance.setSkinFromUrl(skinUrl);
        }
    </script>
</body>
</html>
