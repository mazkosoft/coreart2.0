<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 音乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    
    <script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>
</head>
<body>

    <div class="flex flex-col min-h-screen relative">
        <div id="header-container"></div>
        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-12 relative min-h-[600px]">
            <div id="tab-Musics" class="tab-content animate-fade-in space-y-8 mt-6">
                
                <div class="relative w-full flex justify-center py-10">
                    <div class="absolute inset-0 pointer-events-none opacity-20" style="background: radial-gradient(circle, #00ccff 0%, transparent 70%);"></div>
                    <div id="webamp-container" class="relative z-50 w-[275px] h-[350px]"></div>
                </div>

                <div class="relative bg-[#f0f8ff]/85 backdrop-blur-xl border-[1.5px] border-[#fff]/70 ring-1 ring-[#3a8ef5]/30 shadow-[0_8px_25px_rgba(0,40,80,0.1),inset_0_1px_1px_rgba(255,255,255,0.9)] flex flex-col rounded-[0.6rem]">
                    <div class="relative bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] border-[#0055cc] flex items-center justify-between px-4 border-b-[1.5px] shadow-sm shrink-0 rounded-t-[0.6rem] h-[36px]">
                        <div class="absolute top-[2px] left-[3px] right-[3px] h-[48%] bg-gradient-to-b from-white/70 to-white/10 pointer-events-none z-10 shadow-[0_1px_1px_rgba(255,255,255,0.3)] rounded-[0.4rem]"></div>
                        <div class="relative z-20 flex items-center gap-2 text-white font-black text-[13px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)] pl-1">
                            <i data-lucide="palette" class="w-4 h-4"></i>
                            <span class="uppercase tracking-[0.1em] pt-0.5 text-shadow-aero font-[Noto Sans SC]">皮肤终端 (Skin Terminal)</span>
                        </div>
                        <div class="relative z-20 text-[10px] text-white/80 font-bold px-2 py-0.5 bg-black/20 rounded border border-white/20" id="current-skin-badge">加载中...</div>
                    </div>
                    
                    <div class="p-6">
                        <div id="skin-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                            </div>
                    </div>
                </div>

                <div class="relative bg-[#f0f8ff]/85 backdrop-blur-xl border-[1.5px] border-[#fff]/70 ring-1 ring-[#3a8ef5]/30 shadow-sm flex flex-col rounded-[0.6rem]">
                    <div class="relative bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] border-[#0055cc] flex items-center justify-between px-4 border-b-[1.5px] shadow-sm shrink-0 rounded-t-[0.6rem] h-[36px]">
                        <div class="absolute top-[2px] left-[3px] right-[3px] h-[48%] bg-gradient-to-b from-white/70 to-white/10 pointer-events-none z-10 shadow-[0_1px_1px_rgba(255,255,255,0.3)] rounded-[0.4rem]"></div>
                        <div class="relative z-20 flex items-center gap-2 text-white font-black text-[13px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)] pl-1">
                            <img src="img/Folder203.ico" class="w-[25px] h-[25px] object-contain drop-shadow-md" onerror="this.style.display='none'">
                            <span class="uppercase tracking-[0.1em] pt-0.5 text-shadow-aero font-[Noto Sans SC]">本地歌单 (Playlists)</span>
                        </div>
                    </div>
                    <div id="music-playlist-container" class="p-6"></div>
                </div>

            </div>
        </main>
        <div id="footer-container"></div>
    </div>

    <script>window.ACTIVE_PAGE = 'musics';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        let webampInstance = null;

        // 1. 完全对应你提供的文件名名单
        const SKINS_LIST = [
            { id: 'aqua', name: 'Aqua X', file: 'Aqua_X.wsz' },
            { id: 'argentum', name: 'Argentum Blue', file: 'Argentum_Blue.wsz' },
            { id: 'dolphin', name: 'Dolphin Trio', file: 'Dolphin_Trio.wsz' },
            { id: 'glass', name: 'Glass Amp 4', file: 'Glass_Amp_4.wsz' },
            { id: 'water', name: 'Waterdrops', file: 'Waterdrops.wsz' },
            { id: 'wmp', name: 'Windows Media', file: 'WindowsMediaPlayer1-0.wsz' },
            { id: 'yuna', name: 'Yunaofffx', file: 'Yunaofffx.wsz' }
        ];

        let currentActiveId = SKINS_LIST[0].id;

        window.addEventListener('DOMContentLoaded', () => {
            renderSkinGrid(); // 初始化按钮
            setTimeout(() => {
                initWebampPlayer();
                if (typeof renderMusicPlaylist === 'function') {
                    renderMusicPlaylist('music-playlist-container');
                }
            }, 300);
        });

        function initWebampPlayer() {
            const container = document.getElementById('webamp-container');
            if (typeof Webamp === 'undefined') return;

            // 获取 MP3 的绝对路径以防 404
            const musicPath = new URL("music/elis_ladder-thunder_disc.mp3", window.location.href).href;

            webampInstance = new Webamp({
                initialTracks: [{
                    metaData: { artist: "Eli's Ladder", title: "Thunder Disc" },
                    url: musicPath
                }],
                // 默认加载第一个皮肤
                initialSkin: {
                    url: new URL(`skin/${SKINS_LIST[0].file}`, window.location.href).href
                },
                __initialWindowLayout: {
                    main: { position: { x: 0, y: 0 } },
                    equalizer: { position: { x: 0, y: 116 } },
                    playlist: { position: { x: 0, y: 232 } } 
                }
            });

            webampInstance.renderWhenReady(container).then(() => {
                const webampDom = document.getElementById('webamp');
                if (webampDom) {
                    webampDom.style.position = 'absolute';
                    webampDom.style.left = '0';
                    webampDom.style.top = '0';
                }
                updateSkinBadge(SKINS_LIST[0].name);
            });
        }

        // 渲染切换皮肤的按钮网格
        function renderSkinGrid() {
            const grid = document.getElementById('skin-grid');
            if (!grid) return;

            grid.innerHTML = SKINS_LIST.map(skin => {
                const isActive = skin.id === currentActiveId;
                return `
                    <button onclick="handleSkinSwitch('${skin.id}', '${skin.file}', '${skin.name}')" 
                        class="flex items-center gap-3 p-3 rounded-lg border transition-all duration-300 group cursor-pointer
                        ${isActive ? 'bg-[#e6f4ff] border-[#3a8ef5] shadow-sm' : 'bg-white/40 border-[#d0e0f0] hover:bg-white hover:border-[#88ccff]'}">
                        <div class="w-8 h-8 rounded-md bg-gradient-to-br from-[#00ccff] to-[#0077ff] flex items-center justify-center text-white shrink-0 shadow-sm group-hover:scale-110 transition-transform">
                            <i data-lucide="music-2" class="w-4 h-4"></i>
                        </div>
                        <div class="text-left overflow-hidden">
                            <div class="text-[11px] font-black text-[#004477] truncate">${skin.name}</div>
                            <div class="text-[9px] font-bold text-[#88aabb] uppercase tracking-tighter">${isActive ? 'ACTIVE' : 'SELECT'}</div>
                        </div>
                    </button>
                `;
            }).join('');
            
            if(window.lucide) lucide.createIcons();
        }

        function handleSkinSwitch(id, filename, name) {
            if (!webampInstance || id === currentActiveId) return;

            currentActiveId = id;
            renderSkinGrid(); // 刷新高亮状态
            
            const skinUrl = new URL(`skin/${filename}`, window.location.href).href;
            webampInstance.setSkinFromUrl(skinUrl);
            updateSkinBadge(name);
        }

        function updateSkinBadge(name) {
            const badge = document.getElementById('current-skin-badge');
            if(badge) badge.innerText = name;
        }
    </script>
</body>
</html>
