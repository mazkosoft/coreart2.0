<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 美学百科</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>

    <div class="flex flex-col min-h-screen relative">
        
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Navigation Container -->
        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-12 relative min-h-[600px]">
            
            <div id="tab-Aesthetics" class="tab-content animate-fade-in">
                <div class="relative bg-[#f0f8ff]/85 backdrop-blur-xl border-[1.5px] border-[#fff]/70 ring-1 ring-[#3a8ef5]/30 shadow-[0_8px_25px_rgba(0,40,80,0.1),inset_0_1px_1px_rgba(255,255,255,0.9)] flex flex-col rounded-[0.6rem] min-h-[600px]">
                    <div class="relative bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] border-[#0055cc] flex items-center justify-between px-4 border-b-[1.5px] shadow-sm shrink-0 rounded-t-[0.6rem] h-[36px]">
                        <div class="absolute top-[2px] left-[3px] right-[3px] h-[48%] bg-gradient-to-b from-white/70 to-white/10 pointer-events-none z-10 shadow-[0_1px_1px_rgba(255,255,255,0.3)] rounded-[0.4rem]"></div>
                        <div class="relative z-20 flex items-center gap-2 text-white font-black text-[13px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)] pl-1">
                            <img src="img/Folder053.ico" class="w-[25px] h-[25px] object-contain filter drop-shadow-md">
                            <span class="uppercase tracking-[0.1em] pt-0.5 text-shadow-aero font-[Noto Sans SC]">美学百科 (Aesthetics)</span>
                        </div>
                    </div>
                    <div class="p-6 flex flex-col gap-6">
                        <div class="bg-gradient-to-b from-white/60 to-[#f0f9ff]/60 border border-white/50 rounded-lg p-4 shadow-sm flex flex-col md:flex-row gap-4 items-center backdrop-blur-sm">
                            <div class="flex items-center gap-3 flex-1">
                                <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-green-600 rounded-lg shadow-md flex items-center justify-center border border-white shrink-0 text-white">
                                    <i data-lucide="book-open" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h2 class="text-lg font-black text-[#1a3a5a] text-shadow-sm leading-tight">数据库索引</h2>
                                    <p class="text-[11px] font-bold text-[#557799]">Aesthetics Database Index</p>
                                </div>
                            </div>
                            <div class="w-full md:w-auto min-w-[320px] relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none z-10">
                                    <i data-lucide="search" class="w-[14px] h-[14px] text-[#005588]/60"></i>
                                </div>
                                <input type="text" id="aesthetics-search" oninput="renderAesthetics()" placeholder="搜索美学风格..." class="w-full pl-9 pr-4 py-2 bg-white/80 border border-[#aaddff] rounded-[0.5rem] text-sm font-bold text-[#004477] shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] outline-none focus:bg-white focus:ring-2 focus:ring-[#0099ff]/30 transition-all">
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2" id="aesthetics-tags"></div>

                        <div id="aesthetics-grid" class="space-y-8"></div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Container -->
        <div id="footer-container"></div>

    </div>


    <!-- Scripts -->
    <script>window.ACTIVE_PAGE = 'aesthetics';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // Aesthetics Page Specific Logic
        let activeAestheticsTag = '#All';

        window.addEventListener('DOMContentLoaded', () => {
            // Wait for components to load then init page specific stuff
            setTimeout(() => {
                initAestheticsTags();
                renderAesthetics();
            }, 100);
        });

        function initAestheticsTags() {
            const tags = ['#All', '#FrutigerAero', '#Weirdcore', '#Dreamcore', '#Liminal', '#Xpiritualism'];
            const container = document.getElementById('aesthetics-tags');
            if(!container) return;
            
            container.innerHTML = tags.map(tag => `
                <button onclick="setAestheticsTag('${tag}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-black border transition-all duration-200 shadow-sm ${activeAestheticsTag === tag ? 'bg-gradient-to-b from-[#009dff] to-[#0077ff] text-white border-[#0055cc]' : 'bg-gradient-to-b from-white to-[#f0f9ff] text-[#557799] border-[#cceeff] hover:border-[#99ccff] hover:bg-white'}">
                    <i data-lucide="tag" class="w-3 h-3"></i> ${tag === '#All' ? '全部风格' : tag.replace('#','')}
                </button>
            `).join('');
            lucide.createIcons();
        }

        window.setAestheticsTag = (tag) => {
            activeAestheticsTag = tag;
            initAestheticsTags();
            renderAesthetics();
        }

        function renderAesthetics() {
            const grid = document.getElementById('aesthetics-grid');
            const searchInput = document.getElementById('aesthetics-search');
            if(!grid || !searchInput) return;
            
            const searchTerm = searchInput.value.toLowerCase();
            
            // 分组逻辑
            const groups = {};
            // Assuming ARTISTS is available globally from data.js
            if (typeof ARTISTS === 'undefined') return;

            ARTISTS.forEach(artist => {
                const matchSearch = artist.name.toLowerCase().includes(searchTerm) || artist.description.toLowerCase().includes(searchTerm);
                const matchTag = activeAestheticsTag === '#All' || artist.category.toLowerCase().includes(activeAestheticsTag.replace('#','').toLowerCase()) || artist.tags.includes(activeAestheticsTag);
                
                if(matchSearch && matchTag) {
                    if(!groups[artist.category]) groups[artist.category] = [];
                    groups[artist.category].push(artist);
                }
            });

            if(Object.keys(groups).length === 0) {
                grid.innerHTML = '<div class="text-center py-10 text-[#88aabb] font-bold">未找到匹配的美学条目</div>';
                return;
            }

            grid.innerHTML = Object.entries(groups).map(([category, artists]) => `
                <div class="animate-fade-in">
                    <div class="flex items-center gap-2 mb-3 border-b border-[#a0b0c0]/30 pb-2">
                        <i data-lucide="chevron-down" class="w-4 h-4 text-[#005588]"></i>
                        <h3 class="text-sm font-black text-[#004477] uppercase tracking-wider">${category}</h3>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${artists.map(artist => `
                            <div onclick="openArtistModal('${artist.id}')" class="group bg-white/70 border border-[#e0f0ff] rounded-[0.6rem] p-3 shadow-sm hover:bg-white hover:border-[#aaddff] hover:shadow-md transition-all cursor-pointer flex gap-4 items-start active:scale-[0.98]">
                                <div class="w-16 h-16 shrink-0 bg-white p-0.5 border border-[#cceeff] shadow-sm rounded-sm overflow-hidden">
                                    <img src="${artist.coverImage}" class="w-full h-full object-cover rounded-[1px] group-hover:scale-110 transition-transform duration-500" alt="${artist.name}">
                                </div>
                                <div class="flex-1 min-w-0 pt-0.5">
                                    <h4 class="font-black text-[#005588] text-xs mb-1 group-hover:text-[#0088cc] truncate">${artist.name}</h4>
                                    <p class="text-[11px] text-[#556677] line-clamp-2 leading-tight font-medium">${artist.description}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
