<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 图集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>

    <div class="flex flex-col min-h-screen relative">
        
        <div id="header-container"></div>

        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-12 relative min-h-[600px]">
            
            <div id="tab-Gallery" class="tab-content animate-fade-in space-y-4">
                
                <div class="relative w-full h-[320px] rounded-[0.8rem] overflow-hidden border-[1.5px] border-[#aaddff] shadow-[0_8px_25px_rgba(0,0,0,0.15)] group bg-black" id="gallery-hero-slider">
                </div>

                <div class="relative w-full bg-gradient-to-r from-[#e6f4ff] to-[#f0f8ff] border border-[#b8d6fb] rounded-[0.8rem] p-6 flex flex-col md:flex-row items-center justify-between gap-6 shadow-sm overflow-hidden">
                     <div class="flex flex-col gap-2 relative z-10">
                        <h3 class="text-xl font-black text-[#004477]">你的作品也能在这里展示！</h3>
                        <p class="text-xs font-bold text-[#557799]">我们鼓励社区共创。请前往 QQ群相册 上传你的原创作品、二创或收集的素材。优秀作品将选入官网展示。</p>
                     </div>
                     <a href="https://qm.qq.com/q/tKnyByyci4" target="_blank" class="shrink-0 relative inline-flex items-center justify-center gap-1.5 px-6 py-3 rounded-[0.6rem] font-black text-white text-[13px] shadow-md border-[1.5px] border-[#0055cc] bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] hover:brightness-110 active:translate-y-[1px] transition-all cursor-pointer z-10">
                        <div class="absolute top-[2px] left-[2px] right-[2px] h-[45%] bg-gradient-to-b from-white/90 to-white/10 rounded-[0.35rem] pointer-events-none z-10"></div>
                        <span class="relative z-20 flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i> 立即加入</span>
                     </a>
                </div>

                <div class="relative bg-[#f0f8ff]/85 backdrop-blur-xl border-[1.5px] border-[#fff]/70 ring-1 ring-[#3a8ef5]/30 shadow-[0_8px_25px_rgba(0,40,80,0.1),inset_0_1px_1px_rgba(255,255,255,0.9)] flex flex-col rounded-[0.6rem]">
                    <div class="relative bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] border-[#0055cc] flex items-center justify-between px-4 border-b-[1.5px] shadow-sm shrink-0 rounded-t-[0.6rem] h-[36px]">
                        <div class="absolute top-[2px] left-[3px] right-[3px] h-[48%] bg-gradient-to-b from-white/70 to-white/10 pointer-events-none z-10 shadow-[0_1px_1px_rgba(255,255,255,0.3)] rounded-[0.4rem]"></div>
                        <div class="relative z-20 flex items-center gap-2 text-white font-black text-[13px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)] pl-1">
                        <img src="img/Folder051.ico" class="w-[25px] h-[25px] object-contain drop-shadow-md">
                        <span class="uppercase tracking-[0.1em] pt-0.5 text-shadow-aero font-[Noto Sans SC]">社区图集 (Community Albums)</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4" id="gallery-grid"></div>
                        
                        <div class="flex flex-wrap justify-center items-center gap-4 mt-8 pt-6 border-t border-[#cceeff]" id="pagination-container">
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <div id="footer-container"></div>

    </div>

    <div id="lightbox-modal" class="fixed inset-0 z-[99999] hidden flex flex-col items-center justify-center bg-black/90 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 cursor-zoom-out" onclick="closeLightbox()"></div>
        
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-white/70 hover:text-white z-50 p-2 bg-white/10 rounded-full backdrop-blur-md border border-white/20 hover:bg-white/30 transition-all cursor-pointer">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        
        <button onclick="changeLightboxImage(-1)" class="absolute left-4 md:left-10 top-1/2 -translate-y-1/2 text-white/70 hover:text-[#00ccff] z-50 p-3 bg-white/10 rounded-full backdrop-blur-md border border-white/20 hover:bg-white/30 hover:scale-110 transition-all cursor-pointer">
            <i data-lucide="chevron-left" class="w-8 h-8"></i>
        </button>
        <button onclick="changeLightboxImage(1)" class="absolute right-4 md:right-10 top-1/2 -translate-y-1/2 text-white/70 hover:text-[#00ccff] z-50 p-3 bg-white/10 rounded-full backdrop-blur-md border border-white/20 hover:bg-white/30 hover:scale-110 transition-all cursor-pointer">
            <i data-lucide="chevron-right" class="w-8 h-8"></i>
        </button>

        <div class="relative z-40 w-full max-w-[90vw] h-[75vh] flex items-center justify-center pointer-events-none">
            <div id="lightbox-loading" class="absolute inset-0 flex items-center justify-center text-[#00ccff]">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin"></i>
            </div>
            <img id="lightbox-image" src="" class="max-w-full max-h-full object-contain rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)] transition-transform duration-300 scale-95 pointer-events-auto cursor-zoom-out relative z-10" alt="Preview" onclick="closeLightbox()" onload="document.getElementById('lightbox-loading').style.display='none'">
        </div>

        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-50 bg-[#001122]/80 backdrop-blur-xl border border-[#005588]/50 px-8 py-4 rounded-2xl text-center flex flex-col gap-1.5 min-w-[320px] shadow-[0_10px_30px_rgba(0,0,0,0.5)] transform translate-y-4 opacity-0 transition-all duration-500" id="lightbox-info">
            <h3 id="lightbox-title" class="text-xl font-black tracking-widest text-white drop-shadow-md"></h3>
            <div class="flex items-center justify-center gap-6 text-xs font-bold text-[#88aabb] mt-1">
                <span class="flex items-center gap-1.5"><i data-lucide="user" class="w-4 h-4 text-[#00ccff]"></i> <span id="lightbox-author"></span></span>
                <span class="flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4 text-[#00ccff]"></i> <span id="lightbox-date"></span></span>
            </div>
        </div>
    </div>

    <script>window.ACTIVE_PAGE = 'gallery';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // --- 核心：提取你 v1 版本的 266 张图片数据 ---
        const GALLERY_IMAGES = [];
        let indexCounter = 1;
        
        // 1. 压入 15 张 GIF
        for(let i = 1; i <= 15; i++) {
            GALLERY_IMAGES.push({
                image: `https://coreart.cn/core2026/pic/1%20(${i}).gif`,
                title: `拜年祭动图作品 ${indexCounter++}`,
                author: "社区创作者",
                date: "2026-01"
            });
        }
        
        // 2. 压入 251 张 JPEG
        for(let i = 1; i <= 251; i++) {
            GALLERY_IMAGES.push({
                image: `https://coreart.cn/core2026/pic/1%20(${i}).jpeg`,
                title: `拜年祭静态作品 ${indexCounter++}`,
                author: "社区创作者",
                date: "2026-01"
            });
        }

        // 分页设置 (因为你原本的布局是 lg:grid-cols-6，所以每页设置 24 张，可以完美排满 4 行)
        let currentPage = 1;
        const itemsPerPage = 24; 
        let currentLightboxIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initGallerySlider(); // 完美保留你原有的功能
                renderGalleryPage(1); // 替换原来的 renderGallery
            }, 100);
        });

        // 完全保留你原有的轮播图代码
        function initGallerySlider() {
            const slides = [
                { url: "img/menber-arts.webp", title: "2024 年度社区精选", subtitle: "Community Best of 2024" },
                { url: "img/psc.webp", title: "每周速途：失落信号", subtitle: "Weekly Challenge Winner" },
                { url: "img/cover.jpg", title: "Liminal Spaces 摄影展", subtitle: "Group Photography Event" }
            ];
            
            const container = document.getElementById('gallery-hero-slider');
            if(!container) return;
            
            let currentIndex = 0;

            function renderGallerySlides() {
                container.innerHTML = slides.map((slide, idx) => `
                    <div class="absolute inset-0 transition-opacity duration-700 ease-in-out ${idx === currentIndex ? 'opacity-100' : 'opacity-0'}">
                        <img class="w-full h-full object-cover opacity-90" src="${slide.url}" alt="Slide">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#002244] via-transparent to-transparent"></div>
                    </div>
                `).join('') + `
                    <div class="absolute bottom-0 left-0 right-0 p-8 flex flex-col items-start justify-end pointer-events-none">
                        <h2 class="text-3xl font-black text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)] tracking-tight mb-1 font-[Noto Sans SC]">${slides[currentIndex].title}</h2>
                        <p class="text-blue-100/90 text-[12px] font-bold tracking-wider uppercase drop-shadow-md">${slides[currentIndex].subtitle}</p>
                    </div>
                    <button onclick="changeGallerySlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/20 hover:bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-[4px] border border-white/30 shadow-lg cursor-pointer z-10"><i data-lucide="chevron-left"></i></button>
                    <button onclick="changeGallerySlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/20 hover:bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-[4px] border border-white/30 shadow-lg cursor-pointer z-10"><i data-lucide="chevron-right"></i></button>
                `;
                lucide.createIcons();
            }

            window.changeGallerySlide = (dir) => {
                currentIndex = (currentIndex + dir + slides.length) % slides.length;
                renderGallerySlides();
            };

            renderGallerySlides();
        }

        // 修改：带分页和点击事件的渲染逻辑
        function renderGalleryPage(page) {
            currentPage = page;
            const grid = document.getElementById('gallery-grid');
            if(!grid) return;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = GALLERY_IMAGES.slice(startIndex, endIndex);

            // 完美保留你原有的卡片 UI，仅把 a 标签和 icon 改为了本页弹窗逻辑
            grid.innerHTML = pageItems.map((item, localIndex) => {
                const globalIndex = startIndex + localIndex;
                return `
                    <div onclick="openLightbox(${globalIndex})" class="group relative cursor-pointer flex flex-col h-full block">
                        <div class="relative aspect-square bg-white p-1.5 rounded-[6px] border border-[#d0e0f0] shadow-[0_2px_6px_rgba(0,0,0,0.05)] group-hover:shadow-[0_8px_20px_rgba(0,100,255,0.15)] group-hover:border-[#88ccff] group-hover:-translate-y-1 transition-all duration-300 ease-out">
                            <div class="absolute top-0.5 right-0.5 w-full h-full bg-white border border-[#d0e0f0] rounded-[6px] -z-10 translate-x-1 -translate-y-1"></div>
                            <div class="w-full h-full border border-gray-200 overflow-hidden relative bg-[#eeeeee] rounded-[2px]">
                                <img src="${item.image}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt="${item.title}">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center backdrop-blur-[1px]">
                                    <div class="bg-white/20 backdrop-blur-md border border-white/50 p-1.5 rounded-full text-white transform scale-50 group-hover:scale-100 transition-transform duration-300">
                                        <i data-lucide="zoom-in" class="w-4 h-4"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3 px-1 text-center">
                            <h3 class="font-black text-[#004477] text-xs leading-tight group-hover:text-[#0088cc] line-clamp-2 mb-1">${item.title}</h3>
                            <div class="flex justify-center items-center gap-1 mt-1">
                                <span class="inline-block bg-[#f0f8ff] text-[#6688aa] text-[9px] font-bold px-1.5 py-0.5 rounded border border-[#dceeff]">${item.author}</span>
                                <span class="inline-block bg-[#f0f8ff] text-[#6688aa] text-[9px] font-bold px-1.5 py-0.5 rounded border border-[#dceeff]">${item.date}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            if(window.lucide) lucide.createIcons();
            renderPagination();
        }

        // 新增：渲染分页控制条
        function renderPagination() {
            const totalPages = Math.ceil(GALLERY_IMAGES.length / itemsPerPage);
            const container = document.getElementById('pagination-container');
            if(!container) return;

            let html = '';
            
            if(currentPage > 1) {
                html += `<button onclick="renderGalleryPage(${currentPage - 1}); window.scrollTo(0, 300);" class="px-4 py-2 rounded-lg bg-white hover:bg-[#f0f8ff] text-[#0066cc] border border-[#aaddff] hover:shadow-sm transition-all font-bold text-xs cursor-pointer">« 上一页</button>`;
            } else {
                html += `<button class="px-4 py-2 rounded-lg bg-white/50 text-[#88aabb] border border-[#dceeff] cursor-not-allowed font-bold text-xs">« 上一页</button>`;
            }

            html += `<span class="text-[#004477] font-black text-sm px-2">第 ${currentPage} / ${totalPages} 页</span>`;

            if(currentPage < totalPages) {
                html += `<button onclick="renderGalleryPage(${currentPage + 1}); window.scrollTo(0, 300);" class="px-4 py-2 rounded-lg bg-white hover:bg-[#f0f8ff] text-[#0066cc] border border-[#aaddff] hover:shadow-sm transition-all font-bold text-xs cursor-pointer">下一页 »</button>`;
            } else {
                html += `<button class="px-4 py-2 rounded-lg bg-white/50 text-[#88aabb] border border-[#dceeff] cursor-not-allowed font-bold text-xs">下一页 »</button>`;
            }
            
            html += `
                <div class="flex items-center gap-2 ml-4">
                    <input type="number" id="page-jump-input" min="1" max="${totalPages}" class="w-14 h-[34px] text-center text-xs font-bold border border-[#aaddff] rounded-lg outline-none focus:ring-2 focus:ring-[#00ccff]/50 bg-white text-[#004477]" placeholder="${currentPage}">
                    <button onclick="jumpToPage()" class="px-3 py-[7px] rounded-lg bg-[#e6f4ff] hover:bg-[#cceeff] text-[#0066cc] border border-[#aaddff] transition-all font-bold text-xs cursor-pointer">跳转</button>
                </div>
            `;

            container.innerHTML = html;
        }

        window.jumpToPage = () => {
            const input = document.getElementById('page-jump-input');
            const totalPages = Math.ceil(GALLERY_IMAGES.length / itemsPerPage);
            let page = parseInt(input.value);
            if(page >= 1 && page <= totalPages) {
                renderGalleryPage(page);
                window.scrollTo(0, 300);
            } else {
                input.value = ''; 
            }
        };

        // --- 新增：大图预览 (Lightbox) 交互 ---
        
        window.openLightbox = (globalIndex) => {
            currentLightboxIndex = globalIndex;
            
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-image');
            const info = document.getElementById('lightbox-info');
            const loading = document.getElementById('lightbox-loading');
            
            loading.style.display = 'flex';
            updateLightboxContent();
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                img.classList.remove('scale-95');
                img.classList.add('scale-100');
                info.classList.remove('translate-y-4', 'opacity-0');
                info.classList.add('translate-y-0', 'opacity-100');
            }, 10);
        };

        window.closeLightbox = () => {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-image');
            const info = document.getElementById('lightbox-info');
            
            modal.classList.add('opacity-0');
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            info.classList.remove('translate-y-0', 'opacity-100');
            info.classList.add('translate-y-4', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
                img.src = ''; 
            }, 300);
        };

        window.changeLightboxImage = (dir) => {
            currentLightboxIndex = (currentLightboxIndex + dir + GALLERY_IMAGES.length) % GALLERY_IMAGES.length;
            
            const img = document.getElementById('lightbox-image');
            const loading = document.getElementById('lightbox-loading');
            
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            img.style.opacity = '0.3';
            loading.style.display = 'flex';
            
            setTimeout(() => {
                updateLightboxContent();
                img.style.opacity = '1';
                img.classList.remove('scale-95');
                img.classList.add('scale-100');
            }, 150);
        };

        function updateLightboxContent() {
            const item = GALLERY_IMAGES[currentLightboxIndex];
            document.getElementById('lightbox-image').src = item.image;
            document.getElementById('lightbox-title').innerText = item.title;
            document.getElementById('lightbox-author').innerText = item.author;
            document.getElementById('lightbox-date').innerText = item.date;
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightbox-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') changeLightboxImage(-1);
                if (e.key === 'ArrowRight') changeLightboxImage(1);
            }
        });
    </script>
</body>
</html>
