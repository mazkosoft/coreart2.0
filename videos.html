<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 视频</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>

    <div class="flex flex-col min-h-screen relative">
        
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Navigation Container -->
        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-12 relative min-h-[600px]">
            
            <div id="tab-Videos" class="tab-content animate-fade-in space-y-6">
                <!-- A. 推荐视频 (Hero) -->
                <div class="relative w-full h-[360px] rounded-[0.8rem] overflow-hidden border-[1.5px] border-[#aaddff] shadow-[0_8px_25px_rgba(0,0,0,0.15)] group bg-black">
                    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1535016120720-40c6874c3b1c?q=80&w=1000')] bg-cover bg-center opacity-60"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 p-8 w-full md:w-2/3 space-y-3">
                        <span class="inline-block px-2 py-1 bg-[#0099ff] text-white text-[10px] font-black rounded-[0.2rem] uppercase tracking-wider">Featured Video</span>
                        <h2 class="text-3xl md:text-4xl font-black text-white leading-tight drop-shadow-lg font-[Noto Sans SC]">2026 拜年祭：寻梦之旅 (Dream Seeker)</h2>
                        <p class="text-gray-200 text-sm font-medium line-clamp-2 drop-shadow-md">年度重磅企划。集结 50+ 位社区创作者，带你穿梭于 Frutiger Aero 的乌托邦与 Weirdcore 的梦核深处。</p>
                        <div class="pt-2 flex gap-3">
                            <button class="flex items-center gap-2 px-5 py-2 bg-white text-[#004477] rounded-full font-black text-xs hover:bg-blue-50 transition-colors shadow-lg">
                                <i data-lucide="play" class="w-4 h-4 fill-current"></i> 立即观看
                            </button>
                            <button class="flex items-center gap-2 px-5 py-2 bg-white/20 text-white rounded-full font-black text-xs hover:bg-white/30 transition-colors backdrop-blur-md border border-white/30">
                                <i data-lucide="plus" class="w-4 h-4"></i> 加入稍后观看
                            </button>
                        </div>
                    </div>
                </div>

                <!-- B. 视频分类栏 -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-hide">
                    <button class="px-4 py-1.5 rounded-full bg-[#0099ff] text-white text-[11px] font-black shadow-md border border-[#0077cc] shrink-0">全部</button>
                    <button class="px-4 py-1.5 rounded-full bg-white text-[#557799] text-[11px] font-black shadow-sm border border-[#cceeff] hover:bg-[#f0f9ff] hover:text-[#0066cc] transition-colors shrink-0">科普解析</button>
                    <button class="px-4 py-1.5 rounded-full bg-white text-[#557799] text-[11px] font-black shadow-sm border border-[#cceeff] hover:bg-[#f0f9ff] hover:text-[#0066cc] transition-colors shrink-0">视觉二创</button>
                    <button class="px-4 py-1.5 rounded-full bg-white text-[#557799] text-[11px] font-black shadow-sm border border-[#cceeff] hover:bg-[#f0f9ff] hover:text-[#0066cc] transition-colors shrink-0">活动展映</button>
                    <button class="px-4 py-1.5 rounded-full bg-white text-[#557799] text-[11px] font-black shadow-sm border border-[#cceeff] hover:bg-[#f0f9ff] hover:text-[#0066cc] transition-colors shrink-0">教程分享</button>
                </div>

                <!-- C. 视频列表 -->
                <div class="relative bg-[#f0f8ff]/85 backdrop-blur-xl border-[1.5px] border-[#fff]/70 ring-1 ring-[#3a8ef5]/30 shadow-[0_8px_25px_rgba(0,40,80,0.1),inset_0_1px_1px_rgba(255,255,255,0.9)] flex flex-col rounded-[0.6rem]">
                    <div class="relative bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] border-[#0055cc] flex items-center justify-between px-4 border-b-[1.5px] shadow-sm shrink-0 rounded-t-[0.6rem] h-[36px]">
                        <div class="absolute top-[2px] left-[3px] right-[3px] h-[48%] bg-gradient-to-b from-white/70 to-white/10 pointer-events-none z-10 shadow-[0_1px_1px_rgba(255,255,255,0.3)] rounded-[0.4rem]"></div>
                        <div class="relative z-20 flex items-center gap-2 text-white font-black text-[13px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)] pl-1">
                            <img src="img/Folder204.ico" class="w-[25px] h-[25px] object-contain drop-shadow-md filter">
                            <span class="uppercase tracking-[0.1em] pt-0.5 text-shadow-aero font-[Noto Sans SC]">视频库 (Video Library)</span>
                        </div>
                    </div>
                    
                    <div id="videos-list-container" class="p-6">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Container -->
        <div id="footer-container"></div>

    </div>

    <!-- Scripts -->
    <script>window.ACTIVE_PAGE = 'videos';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
