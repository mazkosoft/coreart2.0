<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 资源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>

    <div class="flex flex-col min-h-screen relative">
        
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Navigation Container -->
        <div id="nav-container"></div>

        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-0 relative min-h-[600px]">
            
            <div id="tab-Resources" class="tab-content animate-fade-in">
                <div class="relative bg-[#f0f8ff]/85 backdrop-blur-xl border-[1.5px] border-[#fff]/70 ring-1 ring-[#3a8ef5]/30 shadow-[0_8px_25px_rgba(0,40,80,0.1),inset_0_1px_1px_rgba(255,255,255,0.9)] flex flex-col rounded-[0.6rem] min-h-[600px]">
                    <div class="relative bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#00ccff] border-[#0055cc] flex items-center justify-between px-4 border-b-[1.5px] shadow-sm shrink-0 rounded-t-[0.6rem] h-[36px]">
                        <div class="absolute top-[2px] left-[3px] right-[3px] h-[48%] bg-gradient-to-b from-white/70 to-white/10 pointer-events-none z-10 shadow-[0_1px_1px_rgba(255,255,255,0.3)] rounded-[0.4rem]"></div>
                        <div class="relative z-20 flex items-center gap-2 text-white font-black text-[13px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)] pl-1">
                            <img src="img/imageres_123.ico" class="w-[25px] h-[25px] object-contain filter drop-shadow-md">
                            <span class="uppercase tracking-[0.1em] pt-0.5 text-shadow-aero font-[Noto Sans SC]">资源宝库 (Resources)</span>
                        </div>
                        <div class="relative z-20 text-[9px] font-black text-white/80 uppercase tracking-widest bg-white/20 px-2 py-0.5 rounded border border-white/30">
                            <span>上次更新: 2026/1/17</span>
                        </div>
                    </div>
                    <div class="p-6 flex flex-col gap-6">
                        <div class="flex flex-col md:flex-row gap-4 items-center justify-between bg-white/30 p-2 rounded-lg border border-white/40 shadow-sm">
                            <div class="flex flex-wrap gap-2" id="resource-tabs-container"></div>
                            <div class="relative w-full md:w-48 group">
                                <input type="text" id="resource-search" oninput="renderResources()" placeholder="筛选资源..." class="w-full pl-8 pr-3 py-1.5 bg-white/80 border border-[#aaddff] rounded-full text-[11px] font-bold text-[#004477] shadow-inner outline-none focus:ring-2 focus:ring-[#0099ff]/30">
                                <i data-lucide="search" class="w-3 h-3 absolute left-2.5 top-1/2 -translate-y-1/2 text-[#8899aa]"></i>
                            </div>
                        </div>
                        <div id="resources-list" class="space-y-8 pb-10"></div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Container -->
        <div id="footer-container"></div>

    </div>


    <!-- Scripts -->
    <script>window.ACTIVE_PAGE = 'resources';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // Resources Page Specific Logic
        const RESOURCE_TABS = [
            { id: 0, label: "全部", icon: "layout-grid", fullTitle: "All" },
            { id: 1, label: "创作工具", icon: "zap", fullTitle: "多媒体与视觉创作工具" },
            { id: 2, label: "数字档案", icon: "database", fullTitle: "信息检索与数字档案库" },
            { id: 3, label: "美学素材", icon: "palette", fullTitle: "核心美学与资源素材库" },
            { id: 4, label: "怀旧模拟", icon: "gamepad-2", fullTitle: "趣味模拟与怀旧小站" }
        ];

        let currentResourceTab = 0;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                renderResourceTabs();
                renderResources();
            }, 100);
        });

        function renderResourceTabs() {
            const container = document.getElementById('resource-tabs-container');
            if(!container) return;
            
            container.innerHTML = RESOURCE_TABS.map(tab => `
                <button onclick="setResourceTab(${tab.id})" class="relative px-3 py-1.5 rounded-[0.5rem] flex items-center gap-1.5 text-[11px] font-black transition-all duration-200 group select-none border ${currentResourceTab === tab.id ? 'bg-gradient-to-b from-[#009dff] to-[#0077ff] text-white border-[#0055cc]' : 'bg-white/50 text-[#557799] border-transparent hover:bg-white hover:text-[#005588]'}">
                    ${currentResourceTab === tab.id ? '<div class="absolute top-[1px] left-[2px] right-[2px] h-[45%] bg-gradient-to-b from-white/70 to-white/10 rounded-full pointer-events-none"></div>' : ''}
                    <i data-lucide="${tab.icon}" class="w-3.5 h-3.5"></i> ${tab.label}
                </button>
            `).join('');
            lucide.createIcons();
        }

        window.setResourceTab = (id) => {
            currentResourceTab = id;
            renderResourceTabs();
            renderResources();
        }

        window.toggleCategory = (index) => {
            const content = document.getElementById(`cat-content-${index}`);
            const chevron = document.getElementById(`cat-chevron-${index}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                chevron.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                chevron.classList.remove('rotate-180');
            }
        }

        function renderResources() {
            const searchInput = document.getElementById('resource-search');
            const list = document.getElementById('resources-list');
            if(!list || !searchInput) return;
            
            const searchTerm = searchInput.value.toLowerCase();
            
            // 筛选逻辑
            const targetTitle = RESOURCE_TABS.find(t => t.id === currentResourceTab)?.fullTitle;
            
            // Assuming RESOURCES is available globally from data.js
            if (typeof RESOURCES === 'undefined') return;

            const filteredData = RESOURCES.filter(cat => 
                currentResourceTab === 0 || cat.title === targetTitle
            ).map(cat => ({
                ...cat,
                links: cat.links.filter(link => 
                    link.title.toLowerCase().includes(searchTerm) || 
                    link.url.toLowerCase().includes(searchTerm) ||
                    (link.description && link.description.toLowerCase().includes(searchTerm))
                )
            })).filter(cat => cat.links.length > 0);

            if (filteredData.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-[#88aabb] font-bold">没有找到相关资源</div>`;
                return;
            }

            // 根据是否是“全部”标签决定展开状态
            const isAllTab = currentResourceTab === 0;

            list.innerHTML = filteredData.map((cat, index) => `
                <div class="mb-4">
                    <div 
                        onclick="${isAllTab ? `toggleCategory(${index})` : ''}"
                        class="flex items-center justify-between mb-2 pb-2 border-b border-[#aaddff]/30 ${isAllTab ? 'cursor-pointer hover:bg-white/30 rounded px-2 transition-colors select-none' : ''}"
                    >
                        <div class="flex items-center gap-3">
                            
                                <img src="${cat.icon || 'https://s3.mnat.cn/2026/02/24/699db8842fbb9.ico'}" class="w-[30px] h-[30px] object-contain drop-shadow-sm" alt="folder">
                            
                            <h3 class="font-black text-[#005588] text-base tracking-tight">${cat.title}</h3>
                            <span class="bg-[#e6f4ff] text-[#0066cc] text-[10px] font-bold px-2 py-0.5 rounded-full border border-[#cceeff]">${cat.links.length}</span>
                        </div>
                        ${isAllTab ? `<i id="cat-chevron-${index}" data-lucide="chevron-down" class="w-4 h-4 text-[#005588] transition-transform duration-300"></i>` : ''}
                    </div>
                    
                    <div id="cat-content-${index}" class="${isAllTab ? 'hidden' : ''} grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 transition-all duration-300">
                        ${cat.links.map(link => `
                            <a href="${link.url}" target="_blank" class="group flex items-center gap-3 p-3 rounded-[0.6rem] border border-transparent hover:bg-gradient-to-b hover:from-[#f0f9ff] hover:to-[#e6f4ff] hover:border-[#b8d6fb] hover:shadow-[0_2px_5px_rgba(0,100,200,0.05)] transition-all bg-white/40">
                                <div class="w-10 h-10 shrink-0 flex items-center justify-center bg-white/60 rounded-[0.4rem] border border-transparent group-hover:border-[#cceeff] shadow-sm transition-colors relative overflow-hidden">
                                    
                                    <img src="img/ieframe_190.ico" class="w-[30px] h-[30px] object-contain drop-shadow-sm relative z-10">
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="text-[13px] font-black text-[#1e395b] truncate group-hover:text-[#0066cc] transition-colors">${link.title}</div>
                                    <div class="text-[10px] font-bold text-[#8899aa] truncate group-hover:text-[#557799] flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-[#aaddff] group-hover:bg-[#0099ff]"></span> ${new URL(link.url).hostname.replace('www.','')}
                                    </div>
                                    <div class="text-[10px] text-[#004466]/60 mt-0.5 line-clamp-1 opacity-70 group-hover:opacity-100">${link.description}</div>
                                </div>
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-[#aaddff] group-hover:text-[#0088cc] transition-colors opacity-0 group-hover:opacity-100 -translate-x-2 group-hover:translate-x-0 duration-200"></i>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
