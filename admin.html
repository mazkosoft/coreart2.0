<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <style>
        /* Admin Specific Styles */
        .admin-sidebar-link.active {
            background: linear-gradient(to bottom, #e6f4ff, #d0e8ff);
            border-color: #aaddff;
            color: #004477;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 1px 2px rgba(0,0,0,0.05);
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 16px rgba(0,50,100,0.05), inset 0 1px 1px rgba(255,255,255,1);
        }
        /* Data Grid 优化 */
        .data-grid-header {
            background: linear-gradient(to bottom, #f9fcff, #e6f0fa);
            border-bottom: 1px solid #cceeff;
            color: #446688;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
        }
        .data-grid-row:nth-child(even) { background-color: rgba(240, 248, 255, 0.4); }
        .data-grid-row:hover { background-color: #eef8ff; transition: all 0.2s; }
        
        /* 隐藏全局滚动条，使用自定义的 Aero 滚动条 */
        #admin-nav::-webkit-scrollbar, #admin-content::-webkit-scrollbar {
            width: 8px;
        }
        #admin-nav::-webkit-scrollbar-thumb, #admin-content::-webkit-scrollbar-thumb {
            background: #aaddff;
            border-radius: 4px;
        }
        #admin-nav::-webkit-scrollbar-thumb:hover, #admin-content::-webkit-scrollbar-thumb:hover {
            background: #77bbff;
        }
    </style>
</head>
<body class="overflow-hidden bg-[#eef8ff]">

    <div id="login-screen" class="fixed inset-0 z-[9999] bg-[url('img/bg.png')] bg-cover bg-center flex items-center justify-center">
        <div class="absolute inset-0 bg-black/30 backdrop-blur-md"></div>
        <div class="relative bg-white/85 backdrop-blur-xl border-[1.5px] border-white/80 p-8 rounded-[1.2rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] w-full max-w-md flex flex-col items-center gap-6 animate-fade-in">
            <div class="w-20 h-20 bg-gradient-to-b from-white to-[#f0f8ff] rounded-full flex items-center justify-center shadow-[0_4px_10px_rgba(0,50,100,0.1)] border-[2px] border-[#aaddff]">
                <img src="img/imageres_101.ico" class="w-12 h-12 object-contain drop-shadow-sm">
            </div>
            <div class="text-center">
                <h2 class="text-2xl font-black text-[#004477] tracking-wide">CORE ADMIN</h2>
                <p class="text-[11px] text-[#557799] font-bold uppercase tracking-widest mt-1">网站管理控制台</p>
            </div>
            <form onsubmit="handleLogin(event)" class="w-full flex flex-col gap-4">
                <div class="relative group">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#88aabb] group-focus-within:text-[#0088cc] transition-colors"></i>
                    <input type="password" id="admin-password" placeholder="请输入管理员密码 (admin)" class="w-full pl-10 pr-4 py-3 rounded-xl border-[1.5px] border-[#aaddff] bg-white/90 outline-none focus:border-[#0099ff] focus:ring-4 focus:ring-[#0099ff]/20 text-[#004477] font-bold shadow-inner transition-all">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-b from-[#009dff] via-[#0077ff] to-[#0055cc] text-white font-black rounded-xl shadow-[0_4px_15px_rgba(0,100,255,0.3)] hover:brightness-110 active:scale-[0.98] transition-all border border-[#0044aa] relative overflow-hidden">
                    <div class="absolute top-[2px] left-[2px] right-[2px] h-[45%] bg-gradient-to-b from-white/40 to-transparent rounded-t-lg pointer-events-none"></div>
                    <span class="relative z-10 tracking-widest">登录 / LOGIN</span>
                </button>
            </form>
            <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-[#aaddff] to-transparent mt-2"></div>
            <p class="text-[10px] text-[#88aabb] font-bold tracking-wider">Authorized Personnel Only</p>
        </div>
    </div>

    <div id="admin-interface" class="hidden flex h-screen w-full">
        
        <aside class="w-64 bg-gradient-to-b from-[#f4faff] to-[#e6f4ff] border-r border-[#cceeff] flex flex-col shrink-0 z-20 shadow-[2px_0_10px_rgba(0,50,100,0.05)]">
            <div class="h-16 flex items-center gap-3 px-5 border-b border-[#cceeff] bg-white/60 backdrop-blur-md">
                <img src="img/imageres_101.ico" class="w-8 h-8 drop-shadow-sm">
                <div>
                    <h1 class="text-sm font-black text-[#004477] tracking-wide">CORE ADMIN</h1>
                    <div class="flex items-center gap-1.5">
                        <div class="w-2 h-2 bg-[#00cc66] rounded-full shadow-[0_0_5px_#00cc66] animate-pulse"></div>
                        <span class="text-[10px] font-bold text-[#557799] uppercase">System Online</span>
                    </div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-2" id="admin-nav">
                </nav>

            <div class="p-4 border-t border-[#cceeff] bg-white/40">
                <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-[#cc4444] bg-white border border-[#ffcccc] hover:bg-[#fff0f0] hover:border-[#ff9999] shadow-sm transition-all text-xs font-bold">
                    <i data-lucide="log-out" class="w-4 h-4"></i> 安全退出
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 relative">
            <div class="absolute inset-0 bg-[radial-gradient(#dceeff_1px,transparent_1px)] [background-size:16px_16px] opacity-50 pointer-events-none -z-10"></div>
            
            <header class="h-16 bg-white/70 backdrop-blur-xl border-b border-[#cceeff] flex items-center justify-between px-8 shadow-sm z-10 shrink-0">
                <h2 id="page-title" class="text-lg font-black text-[#004477] flex items-center gap-2.5 drop-shadow-sm">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 text-[#0088cc]"></i> 仪表盘
                </h2>
                <div class="flex items-center gap-3">
                    <button onclick="saveAllData()" class="flex items-center gap-1.5 px-4 py-2 bg-gradient-to-b from-[#00cc66] to-[#00aa55] text-white text-xs font-bold rounded-lg shadow-[0_2px_5px_rgba(0,150,80,0.3)] border border-[#008844] hover:brightness-110 active:translate-y-[1px] transition-all">
                        <i data-lucide="save" class="w-4 h-4"></i> 保存更改
                    </button>
                    <button onclick="exportDataJS()" class="flex items-center gap-1.5 px-4 py-2 bg-white text-[#005588] text-xs font-bold rounded-lg shadow-sm border border-[#aaddff] hover:bg-[#f0f9ff] hover:shadow transition-all">
                        <i data-lucide="download" class="w-4 h-4 text-[#0088cc]"></i> 导出 data.js
                    </button>
                    <div class="w-[1px] h-6 bg-[#cceeff] mx-1"></div>
                    <a href="index.html" target="_blank" class="flex items-center gap-1.5 px-4 py-2 bg-white text-[#557799] text-xs font-bold rounded-lg shadow-sm border border-[#e0e0e0] hover:bg-gray-50 hover:text-[#334455] transition-all">
                        <i data-lucide="external-link" class="w-4 h-4"></i> 预览网站
                    </a>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8" id="admin-content">
                </div>
        </main>

    </div>

    <div id="toast" class="fixed bottom-8 right-8 translate-y-20 opacity-0 transition-all duration-300 bg-white/90 backdrop-blur-md border border-[#aaddff] text-[#004477] px-5 py-3.5 rounded-xl shadow-[0_10px_25px_rgba(0,50,100,0.15)] flex items-center gap-3 z-[10000]">
        <i data-lucide="check-circle" class="w-5 h-5 text-[#00cc66]"></i>
        <span id="toast-msg" class="text-sm font-black">Operation Successful</span>
    </div>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
