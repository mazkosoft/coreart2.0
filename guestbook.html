<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核类艺术协会™ | 留言板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ui.css">
    <style>
        /* 动画 */
        @keyframes fade-in-up { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .message-enter { animation: fade-in-up 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* 玻璃拟态增强 */
        .glass-panel {
            background: rgba(240, 248, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.05),
                0 10px 15px rgba(0, 0, 0, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="flex flex-col min-h-screen relative">
        
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Navigation Container -->
        <div id="nav-container"></div>

        <!-- Main Content -->
        <main class="flex-1 w-full max-w-[1040px] mx-auto px-4 pb-12">
            
            <div class="glass-panel rounded-xl flex flex-col h-[700px] overflow-hidden relative">
                <!-- Window Title Bar -->
                <div class="h-10 bg-gradient-to-b from-[#f0f9ff] to-[#d0e6ff] border-b border-[#aaddff] flex items-center justify-between px-4 shrink-0 shadow-sm z-20">
                    <div class="flex items-center gap-2 text-[#004477] font-bold text-sm">
                        <img src="https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Internet%20Explorer/iexplore_7.ico" class="w-4 h-4 drop-shadow-sm">
                        <span>Core Art Association Guestbook</span>
                    </div>
                    <div class="text-[10px] font-bold text-[#557799] bg-white/50 px-2 py-0.5 rounded-full border border-white">
                        <span id="msg-count">0</span> Messages
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="flex-1 relative bg-gradient-to-b from-[#f8fbff]/80 to-[#f0f8ff]/80 overflow-hidden">
                    <!-- Background Pattern -->
                    <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#0066cc 1px, transparent 1px); background-size: 20px 20px;"></div>
                    
                    <!-- Scrollable List -->
                    <div id="guestbook-messages" class="absolute inset-0 overflow-y-auto p-6 space-y-6">
                        <!-- Messages will be injected here -->
                    </div>
                </div>

                <!-- Input Area (Footer) -->
                <div class="relative z-30 bg-[#e6f0fa] border-t border-[#b8d0e8] p-4 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                    <form onsubmit="handleGuestbookSubmit(event)" class="flex flex-col gap-3 max-w-4xl mx-auto">
                        <div class="flex gap-4 items-start">
                            <!-- Avatar Selector -->
                            <div class="relative group">
                                <div class="w-14 h-14 bg-white rounded-lg border-[2px] border-[#aaddff] shadow-inner p-1 cursor-pointer hover:border-[#0099ff] transition-colors relative" onclick="toggleAvatarSelector()">
                                    <img id="current-avatar-preview" src="https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Control%20Panel/imageres_78.ico" class="w-full h-full object-contain rounded-md">
                                    <div class="absolute -bottom-1 -right-1 bg-[#0099ff] text-white rounded-full p-0.5 border border-white shadow-sm">
                                        <i data-lucide="chevron-down" class="w-3 h-3"></i>
                                    </div>
                                </div>
                                <input type="hidden" id="gb-avatar-id" value="0">
                                
                                <!-- Dropdown -->
                                <div id="avatar-selector" class="hidden absolute bottom-full left-0 mb-3 w-64 bg-white/95 backdrop-blur-xl border border-[#aaddff] rounded-xl shadow-2xl p-3 grid grid-cols-4 gap-2 z-50 animate-fade-in-up origin-bottom-left">
                                    <!-- Avatars generated by JS -->
                                </div>
                            </div>

                            <!-- Input Fields -->
                            <div class="flex-1 flex flex-col gap-2">
                                <div class="flex gap-2">
                                    <div class="relative w-1/3">
                                        <i data-lucide="user" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-[#5588aa]"></i>
                                        <input id="gb-nickname" required maxlength="12" placeholder="昵称 / Nickname" class="w-full h-9 pl-8 pr-3 text-[12px] font-bold text-[#004477] bg-white border border-[#aaddff] rounded-[4px] shadow-inner outline-none focus:border-[#0099ff] focus:ring-1 focus:ring-[#0099ff] transition-all">
                                    </div>
                                    <div class="flex-1 text-[10px] text-[#6688aa] flex items-center justify-end px-2 select-none">
                                        <i data-lucide="info" class="w-3 h-3 mr-1"></i> 请文明发言，禁止广告
                                    </div>
                                </div>
                                <div class="relative">
                                    <textarea id="gb-content" required maxlength="200" rows="2" placeholder="写下你的想法... (支持简单的纯文本)" class="w-full p-3 text-[13px] font-medium text-[#224466] bg-white border border-[#aaddff] rounded-[6px] shadow-inner outline-none focus:border-[#0099ff] focus:ring-1 focus:ring-[#0099ff] transition-all resize-none"></textarea>
                                    <button type="submit" class="absolute bottom-2 right-2 px-4 py-1.5 bg-gradient-to-b from-[#009dff] to-[#0066cc] border border-[#004488] rounded-[4px] text-white text-[11px] font-bold shadow-md hover:brightness-110 active:translate-y-[1px] active:shadow-sm transition-all flex items-center gap-1.5">
                                        发送 <i data-lucide="send" class="w-3 h-3"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </main>

        <!-- Footer Container -->
        <div id="footer-container"></div>

    </div>

    <!-- Scripts -->
    <script>window.ACTIVE_PAGE = 'guestbook';</script>
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // Guestbook Page Specific Logic
        const AVATARS = [
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Control%20Panel/imageres_78.ico",         // Default User
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Windows%20Live%20Messenger/msgsres_1.ico", // Messenger
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Games/PurblePlace_102.ico",              // Purble Place
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Games/Chess_128.ico",                    // Chess
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Windows%20Media%20Player/wmplayer_120.ico",// WMP
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Internet%20Explorer/iexplore_7.ico",     // IE
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Games/Solitaire_108.ico",                // Solitaire
            "https://raw.githubusercontent.com/Visnalize/resources/main/icons/win7/Games/Mahjong_102.ico"                   // Mahjong
        ];

        let guestbookData = [
            { id: 1, name: "Webmaster", content: "欢迎来到核类艺术协会留言板！\n这里是大家交流 Frutiger Aero、Weirdcore 等数字美学的小天地。", date: "2024/12/25 10:00", avatar: AVATARS[0], role: "admin" },
            { id: 2, name: "AeroFan99", content: "哇，这个界面太还原了！仿佛回到了 2009 年的夏天。", date: "2025/01/10 14:23", avatar: AVATARS[2] },
            { id: 3, name: "Liminal_Walker", content: "有人知道图集里那张黄色走廊的原始出处吗？感觉像是 Level 0。", date: "2025/01/12 09:15", avatar: AVATARS[1] }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initGuestbook();
            }, 100);
        });

        function initGuestbook() {
            const stored = localStorage.getItem('core_guestbook');
            if(stored) guestbookData = JSON.parse(stored);
            
            renderMessages();
            initAvatarSelector();
        }

        function renderMessages() {
            const container = document.getElementById('guestbook-messages');
            if(!container) return;
            
            const countEl = document.getElementById('msg-count');
            if(countEl) countEl.innerText = guestbookData.length;
            
            container.innerHTML = guestbookData.map(msg => {
                const isAdmin = msg.role === 'admin';
                return `
                <div class="flex gap-4 message-enter group">
                    <div class="flex flex-col items-center gap-1 shrink-0 w-14">
                        <div class="w-12 h-12 bg-white rounded-lg border-2 ${isAdmin ? 'border-[#ffaa00] shadow-[0_0_8px_rgba(255,170,0,0.4)]' : 'border-[#aaddff] shadow-sm'} p-0.5 overflow-hidden relative">
                            <img src="${msg.avatar}" class="w-full h-full object-contain rounded-md">
                            ${isAdmin ? '<div class="absolute -top-1 -right-1 bg-[#ffaa00] text-white text-[8px] font-black px-1 rounded shadow-sm">OP</div>' : ''}
                        </div>
                    </div>
                    <div class="flex-1 max-w-2xl">
                        <div class="flex items-end gap-2 mb-1.5 pl-1">
                            <span class="text-[13px] font-black ${isAdmin ? 'text-[#cc6600]' : 'text-[#004477]'} drop-shadow-sm">${msg.name}</span>
                            <span class="text-[10px] text-[#88aabb] font-mono">${msg.date}</span>
                        </div>
                        <div class="relative bg-white/80 border border-[#b8d6fb] rounded-xl rounded-tl-none p-3 shadow-sm backdrop-blur-md group-hover:bg-white/95 transition-colors">
                            <div class="absolute top-0 -left-[6px]">
                                <svg width="8" height="12" viewBox="0 0 8 12" fill="none">
                                    <path d="M0 0H8V12L0 0Z" fill="${isAdmin ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.8)'}" />
                                    <path d="M0 0L8 12" stroke="#b8d6fb" stroke-width="1"/>
                                </svg>
                            </div>
                            <p class="text-[12px] leading-relaxed text-[#224466] font-medium whitespace-pre-wrap">${msg.content}</p>
                        </div>
                    </div>
                </div>
            `}).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        function initAvatarSelector() {
            const container = document.getElementById('avatar-selector');
            if(!container) return;
            
            container.innerHTML = AVATARS.map((src, idx) => `
                <div onclick="selectAvatar(${idx})" class="w-10 h-10 cursor-pointer hover:bg-[#eef6ff] hover:scale-110 transition-all border border-transparent hover:border-[#aaddff] rounded-lg p-1 flex items-center justify-center">
                    <img src="${src}" class="w-full h-full object-contain">
                </div>
            `).join('');
        }

        window.toggleAvatarSelector = () => {
            const selector = document.getElementById('avatar-selector');
            if(selector) selector.classList.toggle('hidden');
        }

        window.selectAvatar = (idx) => {
            const input = document.getElementById('gb-avatar-id');
            const preview = document.getElementById('current-avatar-preview');
            const selector = document.getElementById('avatar-selector');
            
            if(input) input.value = idx;
            if(preview) preview.src = AVATARS[idx];
            if(selector) selector.classList.add('hidden');
        }

        window.handleGuestbookSubmit = (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('gb-nickname');
            const contentInput = document.getElementById('gb-content');
            const avatarIdx = document.getElementById('gb-avatar-id').value;

            if(!nameInput.value.trim() || !contentInput.value.trim()) return;

            const newMsg = {
                id: Date.now(),
                name: nameInput.value.trim(),
                content: contentInput.value.trim(),
                date: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '/'),
                avatar: AVATARS[avatarIdx]
            };

            guestbookData.push(newMsg);
            localStorage.setItem('core_guestbook', JSON.stringify(guestbookData));
            
            contentInput.value = '';
            renderMessages();
        }
    </script>
</body>
</html>
